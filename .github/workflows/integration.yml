name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  integration:
    name: Integration Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: python
            repository: victron-venus/inverter-dashboard
            ref: ccde631cade6d381b87614cb21c464c7ad024cd4
            dockerfile: dashboard-python.test.dockerfile
          - name: go
            repository: victron-venus/inverter-dashboard-go
            ref: a8efdabd0646fd688e48cef9b5fbcc1263c1df9d
            dockerfile: sources/dashboard/Dockerfile
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit
      - name: Checkout integration tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Checkout pinned dashboard source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: sources/dashboard
          persist-credentials: false
      - name: Build selected dashboard
        run: docker build -f "${{ matrix.dockerfile }}" -t dashboard-under-test:ci sources/dashboard
      - name: Start test stack
        run: |
          mkdir -p reports
          sudo chown 1000:"$(id -g)" reports
          chmod 775 reports
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build mqtt-broker mock-dbus mock-battery mock-pv dashboard
          docker compose -f docker-compose.yml -f docker-compose.ci.yml build test-runner
      - name: Wait for MQTT and dashboard readiness
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm test-runner python tests/wait_ready.py
      - name: Run integration tests
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm test-runner \
            python -m pytest tests/integration/ -v --tb=short \
            --html=/reports/report.html --self-contained-html --junitxml=/reports/junit.xml
      - name: Collect logs
        if: always()
        run: |
          mkdir -p reports
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color > reports/containers.log
      - name: Upload test reports and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: integration-${{ matrix.name }}
          path: reports/
          retention-days: 7
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  integration-status:
    name: Integration Tests
    if: always()
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - name: Require every dashboard variant to pass
        run: test "${{ needs.integration.result }}" = success
