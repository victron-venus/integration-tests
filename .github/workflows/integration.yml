name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      test-suite-ref:
        description: Integration suite revision to check out when called from another repository
        type: string
        default: ''

permissions:
  contents: read

jobs:
  integration:
    name: Integration Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        name: [python, go]
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit
      - name: Checkout integration tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: victron-venus/integration-tests
          ref: ${{ inputs.test-suite-ref || (github.repository == 'victron-venus/integration-tests' && github.sha || 'main') }}
          persist-credentials: false
      - name: Install pinned syntax parser
        run: python3 -m pip install PyYAML==6.0.3
      - name: Run the same isolated integration suite locally and in CI
        env:
          VARIANT: ${{ matrix.name }}
        run: bash scripts/ci.sh "$VARIANT"
      - name: Upload test reports and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: integration-${{ matrix.name }}
          path: reports/
          retention-days: 7

  integration-status:
    name: Integration Tests
    if: always()
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - name: Require every dashboard variant to pass
        run: test "${{ needs.integration.result }}" = success
