name: Opt-in Cerbo qualification

on:
  workflow_dispatch:
    inputs:
      device:
        description: Approved inventory device ID for execute; offline uses the disabled example
        required: true
        default: cerbo-lab-example
        type: string
      execute:
        description: Run the approved lab meter-loss scenario (otherwise offline dry-run)
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cerbo-hardware-lab
  cancel-in-progress: false

jobs:
  plan:
    name: Offline plan (not hardware qualification)
    if: github.ref == 'refs/heads/main' && !inputs.execute
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.13'
      - name: Plan the disabled example without device access
        run: |
          python3 hardware/device_runner.py --inventory hardware/inventory.example.json --output "reports/offline-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Preserve offline plan
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-plan-not-hardware-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/offline-*/
          if-no-files-found: error
          retention-days: 30
  qualify:
    if: github.ref == 'refs/heads/main' && inputs.execute
    runs-on: [self-hosted, linux, cerbo-lab]
    environment: hardware-lab
    timeout-minutes: 375
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run reviewed inventory from the dedicated lab runner
        env:
          DEVICE_ID: ${{ inputs.device }}
          EXECUTE: ${{ inputs.execute }}
        run: |
          case "$DEVICE_ID" in ''|*[!a-zA-Z0-9_-]*) exit 2 ;; esac
          args=(--inventory "/etc/victron-lab/$DEVICE_ID.json" --output "reports/hardware-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT")
          if [ "$EXECUTE" = true ]; then
            args+=(--execute --ack-device "$DEVICE_ID")
          fi
          python3 hardware/device_runner.py "${args[@]}"
      - name: Preserve evidence even when qualification fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hardware-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/hardware-*/
          if-no-files-found: error
          retention-days: 90
